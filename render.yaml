services:
  - type: web
    name: wkucoursekit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: RENDER
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/wkcoursekit.db
    disk:
      name: wkucoursekit-data
      mountPath: /var/data
      sizeGB: 1
